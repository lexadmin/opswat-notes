site_name: Lex 的資安技術筆記
site_description: OPSWAT 解決方案的實作筆記與中文導讀

theme:
  name: material
  language: zh-Hant
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切換到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切換到淺色模式
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - 首頁: index.md
  - MetaDefender Core:
      - metadefender-core/overview.md
      - 安裝與部署: metadefender-core/installation.md
  - 整合應用:
      - ICAP 反向代理整合: icap/overview.md
